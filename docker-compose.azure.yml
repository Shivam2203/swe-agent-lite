version: '3.8'

services:
  swe-agent-azure:
    image: ${AZURE_REGISTRY}/swe-agent-lite:${TAG:-latest}
    container_name: swe-agent-lite
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./dummy_repo:/app/dummy_repo
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"