version: '3.8'

services:
  swe-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockmaster0/swe-agent-lite:latest
    container_name: swe-agent-lite
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./dummy_repo:/app/dummy_repo
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
    networks:
      - swe-network

  swe-agent-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: dockmaster0/swe-agent-lite:dev
    container_name: swe-agent-lite-dev
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENVIRONMENT=development
    volumes:
      - ./:/app
    command: python -m watchfiles "python main.py" /app
    networks:
      - swe-network

  # Optional: ChromaDB as a separate service
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./chroma_db:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - swe-network

  # Optional: API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockmaster0/swe-agent-lite:api
    container_name: swe-agent-api
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8000:8000"
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    networks:
      - swe-network

networks:
  swe-network:
    driver: bridge